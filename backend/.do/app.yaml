# ─────────────────────────────────────────────────────────────────────────────
# DigitalOcean App Platform Spec
#
# Deploy steps:
#   1. Push your code to GitHub
#   2. Go to https://cloud.digitalocean.com/apps → New App → From Spec
#   3. Upload this file  (OR: use DO CLI → `doctl apps create --spec .do/app.yaml`)
#   4. Set the 4 SECRET env vars in the App Platform dashboard after first deploy:
#      AUTH0_CLIENT_SECRET, AUTH0_MGMT_CLIENT_SECRET, GEMINI_API_KEY, GROQ_API_KEY
#   5. Run migrations once: `NODE_ENV=production DATABASE_URL=<see-DO-dashboard> node scripts/migrate.js`
#
# Cost estimate (cheapest):
#   - App (basic-xxs):   $5/month
#   - Dev Database (PG): $7/month
#   - Total:             ~$12/month
#   - New accounts get $200 free credit (60 days)
# ─────────────────────────────────────────────────────────────────────────────

name: neuroadapt-backend
region: nyc   # Options: nyc, ams, sfo, sgp, lon, fra, tor, blr

# ── Web Service ──────────────────────────────────────────────────────────────
services:
  - name: api
    # ── Source (replace with your GitHub username/repo) ──
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # e.g. johndoe/neuroadapt
      branch: main
      deploy_on_push: true

    # ── Build ─────────────────────────────────────────────
    # If your repo root IS the backend folder, use:
    #   dockerfile_path: Dockerfile
    # If backend/ is a subfolder of the repo, use:
    #   source_dir: backend
    #   dockerfile_path: Dockerfile
    source_dir: backend
    dockerfile_path: Dockerfile

    # ── Runtime ───────────────────────────────────────────
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xxs   # 1 vCPU / 512 MB RAM — $5/month

    # ── Health Check ──────────────────────────────────────
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3

    # ── Environment Variables ──────────────────────────────
    envs:
      - key: NODE_ENV
        value: "production"
        scope: RUN_TIME

      # Database — automatically bound to the managed DB below
      - key: DATABASE_URL
        value: ${neuroadapt-db.DATABASE_URL}
        scope: RUN_TIME

      # Auth0 — fill these in after deploy (or set as secrets in dashboard)
      - key: AUTH0_DOMAIN
        value: "https://hackathon-div2k26.us.auth0.com"
        scope: RUN_TIME

      - key: AUTH0_AUDIENCE
        # ⚠️  Update this to your DO app URL after first deploy
        # e.g.  https://neuroadapt-backend-xxxxx.ondigitalocean.app
        value: "https://YOUR-APP-URL.ondigitalocean.app"
        scope: RUN_TIME

      - key: AUTH0_CLIENT_ID
        value: "DcUoVwZnUvWZR8AMcJV11GA9wcWnM82s"
        scope: RUN_TIME

      - key: AUTH0_CLIENT_SECRET
        value: "PASTE_YOUR_SECRET_HERE"   # Set via dashboard as a secret
        scope: RUN_TIME
        type: SECRET

      - key: AUTH0_MGMT_CLIENT_ID
        value: "18p4MaF5q9gb14WDQgLyTBI9laMDhqPj"
        scope: RUN_TIME

      - key: AUTH0_MGMT_CLIENT_SECRET
        value: "PASTE_YOUR_SECRET_HERE"   # Set via dashboard as a secret
        scope: RUN_TIME
        type: SECRET

      - key: GEMINI_API_KEY
        value: "PASTE_YOUR_KEY_HERE"
        scope: RUN_TIME
        type: SECRET

      - key: GROQ_API_KEY
        value: "PASTE_YOUR_KEY_HERE"
        scope: RUN_TIME
        type: SECRET

      - key: HUGGINGFACE_API_KEY
        value: "PASTE_YOUR_KEY_HERE"
        scope: RUN_TIME
        type: SECRET

      - key: CLOUDINARY_CLOUD_NAME
        value: "PASTE_YOUR_VALUE"
        scope: RUN_TIME

      - key: CLOUDINARY_API_KEY
        value: "PASTE_YOUR_VALUE"
        scope: RUN_TIME

      - key: CLOUDINARY_API_SECRET
        value: "PASTE_YOUR_SECRET"
        scope: RUN_TIME
        type: SECRET

      # Your frontend URL (Vercel / Netlify / DO Static Site)
      - key: FRONTEND_URL
        value: "https://YOUR-FRONTEND-URL.app"
        scope: RUN_TIME

# ── Managed PostgreSQL Database ───────────────────────────────────────────────
databases:
  - name: neuroadapt-db
    engine: PG
    version: "16"
    # ── Sizing ──────────────────────────────────────────
    # db-s-dev-database  →  Dev DB, ~$7/month (NOT for production)
    # db-s-1vcpu-1gb     →  Smallest prod DB, $15/month
    size: db-s-dev-database
    num_nodes: 1
    production: false   # set true when going to production
